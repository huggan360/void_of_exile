# Void Realms account service (player sync) -> python on 127.0.0.1:8095
<VirtualHost *:80>
    ServerName void.plainshow.se
    ProxyPreserveHost On
    ProxyRequests Off
    Alias /.well-known/acme-challenge/ "/var/lib/letsencrypt/.well-known/acme-challenge/"
    <Directory "/var/lib/letsencrypt/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        ForceType text/plain
        Require all granted
    </Directory>
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:8095/ retry=0 timeout=30
    ProxyPassReverse / http://127.0.0.1:8095/
    ErrorLog ${APACHE_LOG_DIR}/void_plainshow_error.log
    CustomLog ${APACHE_LOG_DIR}/void_plainshow_access.log combined
</VirtualHost>
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName void.plainshow.se
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:8095/ retry=0 timeout=30
    ProxyPassReverse / http://127.0.0.1:8095/
    ErrorLog ${APACHE_LOG_DIR}/void_plainshow_error.log
    CustomLog ${APACHE_LOG_DIR}/void_plainshow_access.log combined
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/plainshow.se/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/plainshow.se/privkey.pem
</VirtualHost>
</IfModule>
