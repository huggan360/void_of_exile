<style>

ge-rendering:pixelated}.iconart{padding:42px;image-rendering:pixelated}.id{color:#8ca6bc;font:12px ui-monospace,monospace;overflow-wrap:anywhere}.tag{display:inline-block;border:1px solid #466074;border-radius:3px;padding:2px 7px;font-size:12px;color:#c5d7df;margin:3px 4px 3px 0}.tag.good{color:var(--green);border-color:#41754d}.tag.warn{color:#ffd08a;border-color:#926b38}.stats{display:flex;gap:14px;flex-wrap:wrap;color:#d4dfeb;margin:10px 0}.stats b{color:var(--gold)}.sub{font-size:13px;color:var(--muted)}.notice{padding:16px 20px;border-left:3px solid var(--gold);background:#192d3c;margin:16px 0;color:#cfdae3}.empty{padding:30px;color:var(--muted)}a{color:#9dd8ff}dialog{width:min(1180px,96vw);max-height:94vh;border:1px solid #56748b;background:#0d1b29;color:var(--text);padding:0;border-radius:10px;overflow:auto}dialog::backdrop{background:#03090edd;backdrop-filter:blur(5px)}.modalbar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#112436;z-index:3;padding:12px 22px;border-bottom:1px solid var(--line)}#detail{padding:24px}.hero{display:grid;grid-template-columns:minmax(200px,330px) 1fr;gap:28px;align-items:start}.hero img{width:100%;max-height:340px;object-fit:contain;background:#142334;border:1px solid var(--line);image-rendering:pixelated}.hero img.item{padding:75px}.hero h2{margin:0 0 6px}table{border-collapse:collapse;width:100%;margin:12px 0 22px;font-size:14px}th,td{text-align:left;vertical-align:top;padding:9px 11px;border-bottom:1px solid #294052}th{color:#a5bdce;font-weight:500;width:29%}td{overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 ui-monospace,monospace;background:#091521;padding:16px;max-height:520px;overflow:auto}details{margin:12px 0;border:1px solid #2b4559;border-radius:5px;padding:10px 14px}summary{cursor:pointer;color:#b7d5e6}figure{margin:0}figcaption{font-size:12px;color:var(--muted);padding:5px}.attacks{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.attack{padding:12px;border:1px solid var(--line);background:#102233;overflow:hidden}.attack img{width:100%;height:155px;object-fit:contain;image-rendering:pixelated}.smallgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}.sourceart{border:1px solid var(--line);padding:12px;background:#122436;overflow-wrap:anywhere}.sourceart img{width:100%;height:95px;object-fit:contain;image-rendering:pixelated;padding:10px}.section{padding:20px;border:1px solid var(--line);margin:0 0 22px;border-radius:7px;background:#12243680}.links{display:flex;flex-wrap:wrap;gap:8px}.links button{font-size:13px}#more{display:block;margin:25px auto}.swatch{display:inline-block;width:14px;height:14px;vertical-align:middle;border:1px solid #9aa;margin-right:8px}footer{font-size:12px;color:var(--muted);margin-top:36px}@media(max-width:650px){.hero{grid-template-columns:1fr}.hero img{height:220px}header,main{padding:20px}.toolbar{padding:10px}.grid{grid-template-columns:repeat(auto-fill,minmax(225px,1fr))}.modalbar{padding:10px}#detail{padding:16px}}

<header><div class="eyebrow">Void of Exile / Development review</div><h1>Content Atlas</h1><p class="intro">Every registered item, creature and boss in one offline wiki. Inspect the actual artwork, base stats, attacks, loot and spawn routes, then compare the Divine source library with the live game.</p><div class="numbers" id="numbers"></div><details><summary>How to read this audit</summary><div id="notes"></div></details></header>
<div class="toolbar"><nav id="tabs" aria-label="Wiki sections"></nav><div class="filters"><input id="search" type="search" placeholder="Search names, IDs, stats, locations or sets" aria-label="Search wiki"><select id="group" aria-label="Group filter"></select><select id="status" aria-label="Wiring filter"><option value="">All wiring states</option><option value="live">Registered / connected sets</option><option value="inactive">Filtered / unassigned sets</option></select></div></div>
<main><div class="summary" id="summary"></div><div id="content"></div><button id="more" hidden>Show all remaining entries</button><footer id="footer"></footer></main>
<dialog id="modal"><div class="modalbar"><span class="brand">Void of Exile / Content details</span><button id="close" aria-label="Close details">Close</button></div><div id="detail"></div></dialog>
<script id="catalog" type="application/json">__DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('catalog').textContent),A=D.assets,$=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const itemMap=Object.fromEntries(D.items.map(x=>[x.id,x])),enemyMap=Object.fromEntries(D.enemies.map(x=>[x.id,x]));
const tabs=[['items','Items'],['enemies','Enemies'],['bosses','Bosses'],['divine','Divine audit'],['world','World index']];let tab='items',limit=48;
const pretty=k=>k.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
const num=n=>typeof n==='number'?Number(n.toFixed(4)):n;
function val(v){if(v===null||v===undefined)return '-';if(typeof v==='boolean')return v?'Yes':'No';if(typeof v==='number')return E(num(v));if(typeof v==='string')return E(v);if(v.type==='Color')return `<span class="swatch" style="background:#${E(v.hex)}"></span>#${E(v.hex)}`;if(Array.isArray(v))return v.length?v.map(val).join(', '):'None';return Object.keys(v).length?`<pre>${E(JSON.stringify(v,null,2))}</pre>`:'None'}
function table(obj){return '<table><tbody>'+Object.entries(obj).map(([k,v])=>`<tr><th>${E(pretty(k))}</th><td>${val(v)}</td></tr>`).join('')+'</tbody></table>'}
function raw(title,obj){return `<details><summary>${E(title)}</summary><pre>${E(typeof obj==='string'?obj:JSON.stringify(obj,null,2))}</pre></details>`}
function img(key,cls='',alt=''){return key&&A[key]?`<img class="${cls}" src="${A[key]}" alt="${E(alt)}" loading="lazy">`:''}
function badge(t,cls=''){return `<span class="tag ${cls}">${E(t)}</span>`}
function link(id,type){const x=type==='item'?itemMap[id]:enemyMap[id];return `<button data-type="${type}" data-id="${E(id)}">${E(x?.item_name||x?.enemy_name||id)}</button>`}
function selected(obj,keys){return Object.fromEntries(keys.map(k=>[k,obj[k]]).filter(([k,v])=>v!==undefined))}
function references(x){return raw('Source references ('+(x.references||[]).length+')',x.references||[])}
function attacks(x){const shots=x.attack_renders||[];if(!shots.length)return '<p class="sub">No outgoing projectile declared. Actor hazards and abilities, where present, are listed below.</p>';return '<div class="attacks">'+shots.map((shot,i)=>`<div class="attack">${img(shot.image,'','Actual projectile mesh')}<h3>Attack ${i+1}: ${E(shot.attack.style||'projectile')}</h3>${table(selected(shot.attack,['damage_min','damage_max','damage_expression','speed','speed_expression','range','radius','size','cooldown','windup','pattern','count','voxel_model']))}${raw('All attack parameters and source expression',shot.attack)}</div>`).join('')+'</div>'}
function itemDetail(x){const sources=x.acquisition||[];return `<div class="hero"><figure>${img(x.icon,'item',x.item_name)}<figcaption>Actual inventory icon, enlarged with nearest-neighbor pixels</figcaption></figure><div><h2>${E(x.item_name)}</h2><div class="id">${E(x.id)}</div>${badge(x.wiring,x.registered?'good':'warn')}${badge(x.tier===0?'Ungraded / special':'Tier '+x.tier)}${x.divine_set?badge(x.divine_set):''}<p>${E(x.lore)}</p>${table(selected(x,['slot','kind','usable_classes','tier','bag_type','stack_max','opens']))}</div></div><h3>Stats and abilities</h3>${x.combat_notes?`<p>${E(x.combat_notes)}</p>`:''}${x.icon_variants?`<p>Map icon by collected piece count, 1 through 6:</p><div class="smallgrid">${x.icon_variants.map((key,i)=>`<figure>${img(key,'art iconart','Map pieces '+(i+1))}<figcaption>${i+1} pieces</figcaption></figure>`).join('')}</div>`:''}${table(selected(x,['damage_min','damage_max','shots','shot_shares','spread_deg','fire_rate','windup','bonuses','abilities','effects','consumable','primary_effects','secondary_effects','charge','ring']))}<h3>Projectile and visual effects</h3>${x.projectile_image?`<figure>${img(x.projectile_image,'art','Actual outgoing projectile')}<figcaption>Actual mesh preview. Each image is framed independently; compare numeric size values.</figcaption></figure>`:'<p class="sub">No outgoing weapon projectile. Shield, consumable and passive effects use their own parameters.</p>'}${table(selected(x,['projectile','shield_tint','shield_arcs','shield_rainbow','warp','aura_color','aura_power']))}<h3>How to obtain</h3>${!x.registered?'<div class="notice">This item is excluded by the live Divine set filter. Its authored stats are preserved for review; normal Items.make() cannot create it.</div>':''}${sources.length?sources.map(s=>`<div class="section">${s.enemy?link(s.enemy,'enemy'):''}<strong>${E(s.route)}</strong>${table(Object.fromEntries(Object.entries(s).filter(([k])=>!['route','enemy'].includes(k))))}</div>`).join(''):'<p>No direct acquisition route found in the audited tables. Check the source references for special handling.</p>'}${references(x)}${raw('Complete item definition',x)}`}
function enemyDetail(x){const defaults=D.default_enemies.find(z=>z.id===x.id),changes=Object.fromEntries(Object.entries(x).filter(([k,v])=>defaults&&k in defaults&&JSON.stringify(v)!==JSON.stringify(defaults[k])).map(([k,v])=>[k,{source_default:defaults[k],effective:v}]));return `<div class="hero"><figure>${img(x.render,'',x.enemy_name)}<figcaption>Actual creature rig, idle pose. Image framing is normalized.</figcaption></figure><div><h2>${E(x.enemy_name)}</h2><div class="id">${E(x.id)}</div>${badge(x.is_boss?'Boss':x.is_god?'God':'Enemy')}${badge('Registered','good')}${table(selected(x,['hp','defense','xp','behavior','move_speed','damage_multiplier','model','model_scale','body_height','hit_radius']))}</div></div>${x.visual_notes?'<h3>Appearance and motion</h3>':''}${x.visual_notes?`<p>${E(x.visual_notes)}</p>`:''}${x.animation_image?`<figure>${img(x.animation_image,'','Actual animated spirit god, Coilguard and Spirit Spark')}<figcaption>Actual articulated models: hovering, winding up and striking. Shown in the Purple Spirit palette.</figcaption></figure>`:''}<h3>Where it appears</h3>${x.routes.length?x.routes.map(r=>`<details><summary>${E(r.location)}</summary>${table(Object.fromEntries(Object.entries(r).filter(([k])=>k!=='location')))}</details>`).join(''):'<div class="notice">No route found in the expanded spawn tables. See source references for actor or scripted spawning.</div>'}<h3>Attacks and projectiles</h3><p class="sub">Damage values are base values. Apply the enemy damage multiplier and any dungeon multiplier shown above. Dynamic boss expressions are retained in the source; still previews omit flight and particle motion.</p>${attacks(x)}<h3>Combat behavior</h3>${table(selected(x,['aggro_radius','lose_radius','lose_time','keep_distance','wander_radius','follows_leader','orbit_radius','orbit_speed','leash','blink','spawn_anim','carries_torch']))}${x.is_boss?`<h3>Boss phases and scaling</h3>${table(selected(x,['phases','wake_on','intro_time','hp_per_extra_player','support_hp_per_extra_player','lock_gates','bar_radius','abandon_radius','abandon_time','death_time','shell_model','shell_scale','shell_hp','shell_height','shell_radius','follow_up']))}${raw('Actor constants',x.actor_constants)}${raw('Full boss actor: attacks, timings, hazards and movement',x.actor_source)}`:''}<h3>Loot and portals</h3><p>Personal loot eligibility: at least <b>${num(x.loot_threshold*100)}%</b> of the encounter maximum HP in damage.</p>${table(selected(x,['loot_threshold','dungeon_reward','dungeon_potions','dungeon_potion_max','god_potion_stats','portal_drop']))}${x.loot.map(l=>`<div class="section">${l.item?link(l.item,'item'):badge(l.biome_stat?'Biome stat potion':'Random graded pool')}${table(l)}${l.pool?`<div class="links">${D.items.filter(i=>i.registered&&i.id.startsWith('G')&&i.tier===l.pool.tier&&i.slot&&(l.pool.slots||['weapon','armor','spell','bonus']).includes(i.slot)).map(i=>link(i.id,'item')).join('')}</div>`:''}</div>`).join('')}${raw('Config differences from source defaults',changes)}${references(x)}${raw('Complete effective definition',x)}`}
function divineDetail(s){return `<h2>${E(s.name)}</h2>${badge(s.live?'Connected set':'Unassigned set',s.live?'good':'warn')}<p>${s.art.length} unique source items. ${s.art.filter(a=>a.registered).length} registered, ${s.art.filter(a=>a.authored&&!a.registered).length} authored but filtered out.</p><div class="links">${s.bosses.map(b=>link(b,'enemy')).join('')}</div><div class="notice">${s.live?'This set is present in Items.DIVINE_SETS. Individual drop links are on the item pages.':'This source folder is not assigned as a live Divine set. Artwork is shown as supplied; unimplemented items have no gameplay stats or projectile.'}</div><div class="smallgrid">${s.art.map(a=>`<div class="sourceart">${img(a.image,'',a.id)}<div class="id">${E(a.id)}</div>${badge(a.registered?'Registered':a.authored?'Filtered definition':'Artwork only',a.registered?'good':'warn')}${badge(a.imported?'Imported icon':'No imported icon')}<p class="sub">${E(a.source)}</p>${a.authored?link(a.id,'item'):''}${a.error?E(a.error):''}</div>`).join('')}</div>${raw('Full set audit',s)}`}
function openDetail(type,id){let x=type==='item'?itemMap[id]:type==='enemy'?enemyMap[id]:D.divine_audit.find(x=>x.id===id);if(!x)return; $('detail').innerHTML=type==='item'?itemDetail(x):type==='enemy'?enemyDetail(x):divineDetail(x);if(!$('modal').open)$('modal').showModal();$('modal').scrollTop=0;location.hash=encodeURIComponent(type)+':'+encodeURIComponent(id)}
function card(x){if(tab==='items')return `<button class="card" data-type="item" data-id="${E(x.id)}">${img(x.icon,'art iconart',x.item_name)}<div class="body"><div class="id">${E(x.id)}</div><h3>${E(x.item_name)}</h3>${badge(x.kind)}${badge(x.id.startsWith('D_')?'Divine':x.tier?'G'+x.tier:'Special')}${badge(x.registered?'Registered':'Filtered',x.registered?'good':'warn')}<div class="stats">${x.damage_max?`<span>Damage <b>${x.damage_min}-${x.damage_max}</b></span><span>Shots <b>${x.shots}</b></span>`:E(Object.entries(x.bonuses).map(([k,v])=>pretty(k)+' +'+num(v)).join(' / '))}</div><div class="sub">${E(x.slot)}${x.divine_set?' / '+E(x.divine_set):''}</div></div></button>`;if(tab==='divine')return `<button class="card" data-type="divine" data-id="${E(x.id)}">${img(x.art[0]?.image,'art iconart',x.name)}<div class="body"><h3>${E(x.name)}</h3>${badge(x.live?'Connected':'Unassigned',x.live?'good':'warn')}<p>${x.art.length} source items / ${x.registered_ids.length} live items</p><div class="sub">${E(x.bosses.map(b=>enemyMap[b]?.enemy_name||b).join(' / '))||'No live boss assignment'}</div></div></button>`;return `<button class="card" data-type="enemy" data-id="${E(x.id)}">${img(x.render,'art',x.enemy_name)}<div class="body"><div class="id">${E(x.id)}</div><h3>${E(x.enemy_name)}</h3>${badge(x.is_boss?'Boss':x.is_god?'God':'Enemy')}${badge(x.routes.length?'Spawn route found':'Review source',x.routes.length?'good':'warn')}<div class="stats"><span>HP <b>${x.hp.toLocaleString()}</b></span><span>DEF <b>${x.defense}</b></span><span>XP <b>${x.xp}</b></span></div><div class="sub">${E(x.routes[0]?.location||'Scripted / unresolved route')}</div></div></button>`}
function options(){const groups=tab==='items'?[...new Set(D.items.map(x=>x.slot))]:tab==='divine'?[]:tab==='world'?[]:D.biomes.map(b=>b.biome_name).concat(Object.values(D.dungeons).map(d=>d.name));$('group').innerHTML='<option value="">'+(tab==='items'?'All equipment slots':'All locations')+'</option>'+groups.sort().map(s=>`<option>${E(s)}</option>`).join('');$('group').hidden=!groups.length}
function world(){const q=$('search').value.toLowerCase();let html='<div class="notice">Realm coordinates are X and Z (stored as x/y in the 2D layout). Dungeon generation and optional realm features vary with the seed.</div>';for(const b of D.biomes){if(q&&!JSON.stringify(b).toLowerCase().includes(q))continue;const es=D.enemies.filter(e=>e.routes.some(r=>r.location.startsWith(b.biome_name+' -')));html+=`<section class="section"><h2>${E(b.biome_name)}</h2><div class="links">${es.map(e=>link(e.id,'enemy')).join('')}</div>${raw('Biome spawns and features',selected(b,['enemy_packs','features','god_stat','god_stats']))}</section>`}for(const d of Object.values(D.dungeons)){if(q&&!JSON.stringify(d).toLowerCase().includes(q))continue;html+=`<section class="section"><h2>${E(d.name)}</h2><div class="links">${[d.boss,d.miniboss,...d.low_enemies,...d.mid_enemies].filter(Boolean).map(id=>link(id,'enemy')).join('')}</div>${table(selected(d,['rating','common_tier','divine_set','enemy_hp_multiplier','enemy_damage_multiplier','miniboss_chance','treasure_room_chance']))}${raw('Full dungeon definition',d)}</section>`}for(const cp of Object.values(D.campaigns)){if(q&&!JSON.stringify(cp).toLowerCase().includes(q))continue;html+=`<section class="section"><h2>${E(cp.title)}</h2><p>${E(cp.blurb)}</p>${raw('Campaign steps, rewards and scripted spawn formations',cp)}</section>`}html+=raw('Fixed realm layout',D.realm_layout)+raw('All pack formations',D.packs)+raw('Player classes and growth',D.player_classes)+raw('Account levels',D.account_levels);$('content').innerHTML=html;$('summary').textContent='Biomes, dungeons, campaigns and fixed realm locations';$('more').hidden=true}
function render(){if(tab==='world'){world();return}let rows=tab==='items'?D.items:tab==='divine'?D.divine_audit:D.enemies.filter(e=>e.is_boss===(tab==='bosses'));const q=$('search').value.toLowerCase().trim(),g=$('group').value,status=$('status').value;rows=rows.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!g||(tab==='items'?x.slot===g:x.routes.some(r=>r.location.includes(g))))&&(!status||(tab==='items'?x.registered:tab==='divine'?x.live:true)===(status==='live')));rows.sort((a,b)=>tab==='items'?a.slot.localeCompare(b.slot)||a.tier-b.tier||a.item_name.localeCompare(b.item_name):(a.name||a.enemy_name).localeCompare(b.name||b.enemy_name));$('summary').textContent=rows.length+' matching entries / '+Math.min(rows.length,limit)+' shown. Select an entry for all stats and source details.';$('content').innerHTML='<div class="grid">'+rows.slice(0,limit).map(card).join('')+'</div>'+(rows.length?'':'<div class="empty">No matches. Try another name, ID, location or filter.</div>');$('more').hidden=rows.length<=limit}
$('tabs').innerHTML=tabs.map(([id,name])=>`<button data-tab="${id}" aria-selected="${id===tab}">${name}</button>`).join('');$('numbers').innerHTML=[[D.items.filter(i=>i.registered).length,'Live items'],[D.enemies.filter(e=>!e.is_boss).length,'Enemies'],[D.enemies.filter(e=>e.is_boss).length,'Bosses'],[D.divine_audit.filter(s=>!s.live).length,'Unassigned Divine sets']].map(([n,t])=>`<div class="number"><b>${n}</b>${t}</div>`).join('');$('notes').innerHTML=D.audit_notes.map(n=>`<p>${E(n)}</p>`).join('');$('footer').textContent='Generated '+D.generated+' / Offline snapshot / Source: '+D.project+' project and Voidrealm_textures / All data and images are embedded in this file.';
if(A.font){const style=document.createElement('style');style.textContent=`@font-face{font-family:Atlas;src:url("${A.font}") format("truetype");font-display:swap}`;document.head.append(style)}
document.addEventListener('click',e=>{const link=e.target.closest('[data-type]');if(link){openDetail(link.dataset.type,link.dataset.id);return}const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;limit=48;for(const b of $('tabs').children)b.setAttribute('aria-selected',b.dataset.tab===tab);options();render()}});$('close').onclick=()=>{$('modal').close();history.replaceState(null,'',location.pathname+location.search)};$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('close').click()});$('modal').addEventListener('cancel',()=>history.replaceState(null,'',location.pathname+location.search));for(const id of ['search','group','status'])$(id).addEventListener('input',()=>{limit=48;render()});$('more').onclick=()=>{limit=Infinity;render()};function hash(){const [type,id]=location.hash.slice(1).split(':').map(decodeURIComponent);if(type&&id)openDetail(type,id)}window.addEventListener('hashchange',hash);options();render();hash();
// Browser smoke checks visit every details renderer and verify all embedded images.
if(new URLSearchParams(location.search).has('selftest')){const errors=[];for(const i of D.items){try{if(!itemDetail(i).includes(E(i.item_name)))errors.push(i.id)}catch(e){errors.push(i.id+': '+e.message)}}for(const e of D.enemies){try{enemyDetail(e)}catch(err){errors.push(e.id+': '+err.message)}}for(const s of D.divine_audit){try{divineDetail(s)}catch(e){errors.push(s.id+': '+e.message)}}for(const e of D.enemies){if(!A[e.render])errors.push('Missing render '+e.id);for(const a of e.attack_renders)if(!A[a.image])errors.push('Missing attack image '+e.id)}for(const i of D.items)if(i.registered&&!A[i.icon])errors.push('Missing icon '+i.id);for(const [id] of tabs){tab=id;options();render()}tab='items';options();render();document.body.dataset.selftest=errors.length?'FAIL':'PASS';document.body.dataset.testErrors=JSON.stringify(errors);document.body.dataset.testCount=D.items.length+D.enemies.length+D.divine_audit.length;}
